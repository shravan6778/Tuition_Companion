services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Postgre21
      POSTGRES_DB: tuition
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d

  supertokens:
    image: registry.supertokens.io/supertokens/supertokens-postgresql
    depends_on:
      - db
    ports:
      - "3567:3567"
    environment:
      POSTGRESQL_CONNECTION_URI: "postgresql://postgres:Postgre21@db:5432/supertokens"
    restart: unless-stopped

  # Knowledge graph + vector index (a rebuildable copy of what PostgreSQL holds; see backend/app/graph_store).
  # The tag is pinned for reproducibility (3.13.1 = latest stable listed in the release notes on 2026-10-07).
  # Rebuild after wiping this volume:  cd backend && python -m app.db.sync_graph --rebuild
  memgraph:
    image: memgraph/memgraph:3.13.1
    restart: unless-stopped
    ports:
      - "7687:7687"  # Bolt: the backend and python -m app.db.smoke_memgraph connect here
    volumes:
      - memgraph_data:/var/lib/memgraph
    command: ["--log-level=WARNING", "--also-log-to-stderr=true"]

volumes:
  pgdata:
  memgraph_data: